spring.application.name=backend
server.port=8081

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/chemistry_db
spring.datasource.username=postgres
spring.datasource.password=root

# Database Driver Explicitly Stated
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

backend.jwt.secret=mySuperSecretKeyMustBeAtLeast32CharactersLong1234567890!
backend.jwt.access-token-expiry-minutes=60

flyway:
enabled: true
locations: classpath:db/migration
baseline-on-migrate: true

server:
port: ${SERVER_PORT:8080}
servlet:
# Prefixes EVERY endpoint with /api automatically ? e.g. /auth/register
# becomes /api/auth/register. Nothing else needs to change: SecurityConfig's
# requestMatchers match against the path AFTER this prefix is stripped.
context-path: /api

app:
jwt:
secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-every-real-environment}
access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MIN:60}
cors:
allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
swagger-ui:
path: /docs
