spring.application.name=backend

# --- Server ---
server.port=8082
server.servlet.context-path=/api

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/chemistry_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway migrations own the schema. "validate" only checks entities match the
# DB ? it never alters tables. Using "update" here would let Hibernate silently
# change your schema and fight with Flyway; never set this to update/create.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# No explicit dialect line ? Hibernate 6+/7+ auto-detects it from the JDBC URL,
# and setting it manually now just produces a deprecation warning.

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT (single source of truth ? matches JwtUtil's @Value("${app.jwt.secret}")) ---
app.jwt.secret=mySuperSecretKeyMustBeAtLeast32CharactersLong1234567890!
app.jwt.access-token-expiry-minutes=60

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000

# --- Swagger ---
springdoc.swagger-ui.path=/docs

# --- Bootstrap super-admin (used once by DataSeeder on first run) ---
app.bootstrap.super-admin-email=admin@lms.local
app.bootstrap.super-admin-password=ChangeMe123!